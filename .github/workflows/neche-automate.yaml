name: How to upload a file to your GitHub repository

on:
  push:
    branches:
      - main

jobs:

  open-your-github-repository-1:
    runs-on: ubuntu-latest
    needs:
      - click-add-file-2
      - select-your-file-3
    steps:
      - name: Open GitHub repository
        run: hostname

      - name: Click "Add file"
        run: df -h

      - name: Check repository
        run: hostname


  click-add-file-2:
    runs-on: ubuntu-latest
    steps:
      - name: Click "Add file"
        run: df -h


  select-your-file-3:
    runs-on: ubuntu-latest
    needs:
      - wait-for-the-upload-4
      - commit-the-changes-5
    steps:
      - name: Select your file
        run: |
          mkdir -p /tmp/test
          echo "This is a test file." > /tmp/test/testfile.txt

      - name: Confirm file creation
        run: ls -l /tmp/test


  wait-for-the-upload-4:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for the upload
        run: sleep 5


  commit-the-changes-5:
    runs-on: ubuntu-latest
    steps:
      - name: Configure Git
        run: |
          git config --global user.name "Your Name"
          git config --global user.email "your-email@example.com"


  confirm-the-file-is-there-6:
    runs-on: ubuntu-latest
    needs:
      - select-your-file-3
    steps:
      - name: Confirm the file is there
        run: echo "Workflow completed successfully"