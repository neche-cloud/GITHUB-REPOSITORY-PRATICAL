name: How to upload a file to your GitHub repository
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  open-your-github-repository-1:
    runs-on: ubuntu-latest
    steps:
      - name: Open GitHub repository
        run: hostnamectl-neche-repository

  click-add-file-2:
    runs-on: ubuntu-latest
    needs: open-your-github-repository-1
    steps:
      - name: Click "Add file"
        run: df -h

  select-your-file-3:
    runs-on: ubuntu-latest
    needs: click-add-file-2
    steps:
      - name: Select your file
        run: mkdir -p /tmp/test && echo "This is a test file." > /tmp/test/testfile.txt

  wait-for-the-upload-4:
    runs-on: ubuntu-latest
    needs: select-your-file-3
    steps:
      - name: Wait for the upload
        run: sleep 5

  commit-the-changes-5:
    runs-on: ubuntu-latest
    needs: wait-for-the-upload-4
    steps:
      - name: Commit the changes
        run: git config --global user.name "Your Name" && git config --global user

  confirm-the-file-is-there-6:
    runs-on: ubuntu-latest
    needs: commit-the-changes-5
    steps:
      - name: Confirm the file is there
        run: ls -l /tmp/test

      